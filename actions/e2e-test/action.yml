name: E2E test
description: >
  Install Playwright browsers (cached, keyed on the lockfile-resolved version)
  and run the repo's e2e script. Tier 2 by nature — too slow for the PR lane,
  gated on `merge_group` in the two-tier model (see `~/dotclaude/rules/ci.md`).

# Composite, not a reusable workflow: even a Tier 2 job posts through the
# caller's own `ci-success` needs: graph, which only works inside the caller's
# job.

inputs:
  package-manager:
    description: npm or pnpm.
    required: false
    default: npm
  script:
    description: package.json script to run.
    required: false
    default: test:e2e
  install-deps:
    description: Also install Playwright's OS-level dependencies (apt packages).
    required: false
    default: 'true'
  browsers:
    description: >
      Space-separated browser projects to install (e.g. `chromium`). Empty
      installs Playwright's full default set.
    required: false
    default: ''
  pre-run:
    description: >
      Shell command to run after Playwright browsers are ready but before the
      e2e script — for a build step the e2e script needs (e.g. `npm run build`).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Keyed on the lockfile-resolved version, not a hardcoded one — a version
    # bump in the lockfile invalidates this on its own rather than going stale
    # silently.
    - name: Resolve Playwright version
      id: version
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        if [ "$PM" = "pnpm" ]; then
          v=$(pnpm list @playwright/test --depth 0 --json 2>/dev/null | jq -r '.[0].devDependencies["@playwright/test"].version // .[0].dependencies["@playwright/test"].version')
        else
          v=$(npm list @playwright/test --depth 0 --json 2>/dev/null | jq -r '.dependencies["@playwright/test"].version // empty')
        fi
        if [ -z "$v" ] || [ "$v" = "null" ]; then
          echo "::error title=Playwright not found::@playwright/test is not a resolvable dependency."
          exit 1
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.browsers || 'all' }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-
          playwright-${{ runner.os }}-

    # Browser binaries live in the cached ~/.cache/ms-playwright path, so this
    # is skipped on a cache hit. The OS-level deps below are not — they live
    # outside that path and never get restored with it.
    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        if [ "$PM" = "pnpm" ]; then
          pnpm exec playwright install $BROWSERS
        else
          npx playwright install $BROWSERS
        fi

    # The browser binaries are cached a step above; the apt packages
    # `install-deps` downloads were not, so every run re-fetched them from
    # azure.archive.ubuntu.com. NetWorthy PR #790 timed out at its 20-minute
    # cap four times in a row (~20m17s each) with apt still downloading — not a
    # hang, just a slow mirror, and every repo on this path paid the same cost
    # on every run (#49).
    #
    # A STALE CACHE IS STILL CORRECT, which is what makes a coarse key safe
    # here: the cache only lets apt skip a DOWNLOAD. Anything missing, or
    # superseded by a newer version, is fetched normally — so the worst a stale
    # entry costs is the download it would have cost anyway. That is why the
    # key is not tied to a package list nothing can enumerate ahead of time.
    - name: Restore the apt package cache
      if: inputs.install-deps == 'true'
      id: apt-cache
      uses: actions/cache@v6
      with:
        path: /tmp/apt-archives
        key: playwright-apt-${{ runner.os }}-${{ inputs.browsers }}
        restore-keys: |
          playwright-apt-${{ runner.os }}-

    - name: Seed apt from the cache
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        set -uo pipefail
        sudo mkdir -p /var/cache/apt/archives
        # `cp -n`: never clobber a .deb apt already has, and a miss is not an
        # error — an empty or absent cache is the cold path, not a failure.
        if [ -d /tmp/apt-archives ]; then
          sudo cp -n /tmp/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        fi
        # Runners set this false, which is why nothing was left to cache. The
        # archives are cleared after install unless apt is told to keep them.
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages >/dev/null

    # apt-get against a stalled mirror can hang past the job's own timeout with
    # no signal why (#47) — a per-attempt timeout turns that into a fast, clearly
    # labeled failure, and a retry absorbs the transient mirror flake outright.
    - name: Install Playwright OS dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -uo pipefail
        install() {
          if [ "$PM" = "pnpm" ]; then
            pnpm exec playwright install-deps $BROWSERS
          else
            npx playwright install-deps $BROWSERS
          fi
        }
        attempt=1
        until timeout 300 bash -c "$(declare -f install); install"; do
          if [ "$attempt" -ge 3 ]; then
            echo "::error title=Playwright install-deps failed::timed out or failed after $attempt attempts (5m each)"
            exit 1
          fi
          echo "::warning title=Playwright install-deps attempt $attempt failed or timed out::retrying"
          attempt=$((attempt + 1))
          sleep $((attempt * 10))
        done

    # Copy the .debs back out for `actions/cache` to save at post-job. It runs
    # as the runner user and cannot read root-owned /var/cache/apt/archives, so
    # the staging directory is the only thing it can see. Skipped on an exact
    # cache hit: nothing new was downloaded, so re-saving would only churn the
    # entry.
    - name: Harvest the apt package cache
      if: inputs.install-deps == 'true' && steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -uo pipefail
        mkdir -p /tmp/apt-archives
        sudo cp /var/cache/apt/archives/*.deb /tmp/apt-archives/ 2>/dev/null || true
        sudo chown -R "$(id -u):$(id -g)" /tmp/apt-archives
        echo "cached $(find /tmp/apt-archives -name '*.deb' | wc -l) .deb package(s) for the next run"

    - name: Pre-run
      if: inputs.pre-run != ''
      shell: bash
      run: ${{ inputs.pre-run }}

    - name: Run e2e tests
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
        SCRIPT: ${{ inputs.script }}
      run: |
        set -euo pipefail
        if [ "$PM" = "pnpm" ]; then
          pnpm run "$SCRIPT"
        else
          npm run "$SCRIPT"
        fi
