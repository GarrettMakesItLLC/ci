name: File a failure issue
description: >
  Open an issue for an automation failure nobody is watching, reusing the
  existing one instead of filing a duplicate on every run — or, in close
  mode, close the issue a prior run filed once the failure stops recurring.

inputs:
  title:
    description: Issue title. Also the deduplication key, so keep it stable across runs.
    required: true
  body-file:
    description: Path to a file holding the issue body. Required when mode is `file`; unused in `close`.
    required: false
    default: ''
  labels:
    description: Comma-separated labels to apply. Only used in `file` mode.
    required: false
    default: 'type:bug,status:ready'
  dedupe-label:
    description: >
      Label to scope the dedupe search on. Defaults to the first entry of
      `labels`, so a caller that leads with a distinguishing label (e.g.
      `ci-failure`) needs no extra input. A `close` caller that doesn't pass
      `labels` must pass this explicitly — it has to match what the `file`
      call used, or the close search looks under the wrong label.
    required: false
    default: ''
  dedupe-key:
    description: >
      Stable identity for what's failing — a lane or workflow name — used to
      find the issue to reuse. Defaults to `title`, but a caller whose title
      names the symptom (e.g. "is failing" vs. "has gone quiet" for the same
      lane) should pass its own stable key here so both symptoms land on one
      issue instead of each filing its own. A `close` caller must pass the
      same key the `file` call used.
    required: false
    default: ''
  mode:
    description: >
      `file` opens or comments on the tracking issue (the default). `close`
      finds the open issue by the same title/dedupe-label and closes it with
      a comment, no-op if none is open.
    required: false
    default: 'file'
  comment:
    description: >
      Close mode only: leading text for the closing comment, e.g. "Fixed".
      Appended with "as of <run URL>." Defaults to "Resolved".
    required: false
    default: ''
  token:
    description: Token with issues:write.
    required: true

outputs:
  number:
    description: >
      The issue number filed, commented on, or closed. Empty in `close` mode
      when nothing was open to close.
    value: ${{ steps.file.outputs.number || steps.close.outputs.number }}

runs:
  using: composite
  steps:
    # A scheduled or event-driven job that fails silently is the case `file`
    # mode exists for: nothing is watching the Actions tab, so the failure
    # has to arrive somewhere with a queue. `close` mode is the other half —
    # an issue left open after the failure stops recurring inverts the
    # signal, so a caller that re-checks the same condition on every run
    # closes it the moment the check passes again.
    - name: File or update the issue
      if: inputs.mode == 'file'
      id: file
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TITLE: ${{ inputs.title }}
        BODY_FILE: ${{ inputs.body-file }}
        LABELS: ${{ inputs.labels }}
        DEDUPE_LABEL: ${{ inputs.dedupe-label }}
        DEDUPE_KEY: ${{ inputs.dedupe-key }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: "${{ github.action_path }}/file.sh"

    - name: Close the issue
      if: inputs.mode == 'close'
      id: close
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TITLE: ${{ inputs.title }}
        LABELS: ${{ inputs.labels }}
        DEDUPE_LABEL: ${{ inputs.dedupe-label }}
        DEDUPE_KEY: ${{ inputs.dedupe-key }}
        COMMENT: ${{ inputs.comment }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: "${{ github.action_path }}/close.sh"
