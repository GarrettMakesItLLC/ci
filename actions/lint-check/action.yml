name: Lint check
description: >
  Run the repo's linter and fail on any reported error. ESLint by default; any
  `<package-manager> run <script>` linter works by overriding `script`. Warning
  policy belongs to the script (`eslint --max-warnings 0 ...`); this action only
  reads the script's exit code.

# Composite, not a reusable workflow: this gates a PR (Tier 1), and a reusable
# workflow's check name can never match a bare required-context name.

inputs:
  package-manager:
    description: npm or pnpm.
    required: false
    default: npm
  script:
    description: package.json script to run.
    required: false
    default: lint

runs:
  using: composite
  steps:
    - name: Lint
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
        SCRIPT: ${{ inputs.script }}
      run: |
        set -euo pipefail
        if [ "$PM" = "pnpm" ]; then
          pnpm run "$SCRIPT"
        else
          npm run "$SCRIPT"
        fi
