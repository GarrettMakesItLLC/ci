name: Check migration locks
description: >
  Fail when a Prisma migration takes a heavy lock on an existing table without
  `SET LOCAL lock_timeout` before it, runs `CREATE INDEX CONCURRENTLY`
  alongside another statement, adds a `NOT NULL` column with no `DEFAULT`
  to an existing table, runs `ALTER COLUMN ... SET NOT NULL` on an existing
  table, or uses an enum value in the migration that adds it. With
  `strict-constraints`, also fails a `CHECK` or `FOREIGN KEY` added without
  `NOT VALID`. The checker ships with the action
  (`migration-lock-check.py`), so a run fetches nothing.

inputs:
  since:
    description: >
      14-digit migration timestamp. Migrations whose directory sorts before it
      are skipped: they are already applied and checksum-locked, so they
      cannot be fixed in place. Set it to the timestamp of the repo's newest
      migration when adopting the check.
    required: true
  migrations-dir:
    description: Directory of `<timestamp>_<name>/migration.sql` folders.
    required: false
    default: prisma/migrations
  strict-constraints:
    description: >
      `'true'` also fails `ADD CONSTRAINT ... CHECK | FOREIGN KEY` without
      `NOT VALID` on an existing table. Off by default: Prisma generates that
      plain foreign key whenever a relation is added, so enabling it means
      hand-editing those migrations to `NOT VALID` plus a later
      `VALIDATE CONSTRAINT`.
    required: false
    default: 'false'
  checker-ref:
    description: Ignored. The checker is vendored into this action and versions with the `v1` tag.
    required: false
    default: ''
    deprecationMessage: checker-ref is ignored — the checker ships with the action. Remove the input.

runs:
  using: composite
  steps:
    - name: Check migration locks
      shell: bash
      env:
        SINCE: ${{ inputs.since }}
        MIGRATIONS_DIR: ${{ inputs.migrations-dir }}
        STRICT_CONSTRAINTS: ${{ inputs.strict-constraints }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=("$MIGRATIONS_DIR"/*/migration.sql)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::no migrations under $MIGRATIONS_DIR — wrong migrations-dir?"
          exit 1
        fi
        flags=(--since "$SINCE")
        if [ "$STRICT_CONSTRAINTS" = "true" ]; then flags+=(--strict-constraints); fi
        python3 "${{ github.action_path }}/migration-lock-check.py" "${flags[@]}" "${files[@]}"
        echo "✓ no lock-rule violations in ${#files[@]} migration(s) (those before $SINCE are grandfathered)"
