name: Measure Core Web Vitals
description: >
  Run a pinned local Lighthouse over a list of routes served at a base URL and
  write one night's LCP / TBT / CLS record (median of N runs per route). It
  measures and never judges — `cwv-judge` decides whether a rise persisted. The
  caller builds and serves the app first, and needs Chrome on the runner
  (preinstalled on ubuntu-24.04).

inputs:
  base-url:
    description: Origin the routes are served from, e.g. `http://127.0.0.1:4173`. Prefer a server that speaks HTTP/2, or set `http2` — see the README.
    required: true
  http2:
    description: >
      Measure through an HTTP/2 front (TLS, self-signed, pinned in Chrome by
      key) started over `base-url`, which must be a plain `http://` origin.
      Lighthouse models HTTP/1.1's six-connection cap, so a local preview that
      speaks HTTP/1.1 overcharges a page with many preloaded chunks relative to
      production's HTTP/2. Needs `openssl` (on the runner image).
    required: false
    default: 'false'
  routes:
    description: Newline- or comma-separated route paths (each starting with `/`). Blank lines and `#` comments are ignored.
    required: true
  output-file:
    description: Where to write the night record.
    required: false
    default: ''
  runs:
    description: Lighthouse runs per route; the median is kept. Five is Lighthouse's own guidance for a noisy metric like TBT.
    required: false
    default: '5'
  form-factor:
    description: '`mobile` (Lighthouse default throttling) or `desktop`.'
    required: false
    default: mobile
  chrome-path:
    description: Chrome/Chromium binary. Empty lets chrome-launcher find the runner's own.
    required: false
    default: ''

  setup-module:
    description: >
      Path (in the caller's checkout) of an ES module that prepares the page state a route is
      measured in, for a product whose routes sit behind a session or fixture API. It may export
      `setup(context)`, run once on the Playwright browser context (init scripts, request routes,
      cookies), and `prepare(context, { route, url })`, run before each route, whose returned
      string reports the route UNMEASURED with that reason instead of timing an error card. The
      browser is then launched by Playwright, so what the module installs reaches every tab
      Lighthouse opens. Empty keeps the plain launcher.
    required: false
    default: ''
  local-storage:
    description: >
      JSON object of string values written to `localStorage` on every document before the page's
      own scripts run (Lighthouse resets storage before each run; this runs after the reset), e.g.
      a recorded consent answer. Launches the Playwright browser.
    required: false
    default: ''
  abort-url-patterns:
    description: >
      Newline separated regular expressions; a request whose URL matches one is aborted, so a
      measurement run is never counted as a visit by an analytics vendor. Launches the Playwright
      browser.
    required: false
    default: ''
  hide-automation:
    description: >
      `true` hides `navigator.webdriver`. A site that loads no tag for an automated browser (its own
      traffic filter) otherwise measures zero third-party cost. Launches the Playwright browser.
    required: false
    default: 'false'
  third-party:
    description: >
      Whether a run must have loaded third-party requests. `any` records them and never discards a
      run; `required` discards a run that loaded none (a seeded state that did not take); `none`
      discards a run that loaded some. A route whose every run was discarded is UNMEASURED with the
      reason.
    required: false
    default: any

outputs:
  measurements-file:
    description: Path of the night record written (JSON; feed it to `cwv-judge`).
    value: ${{ steps.measure.outputs.file }}

runs:
  using: composite
  steps:
    # Lighthouse is pinned in this action's own package.json: a lab number is
    # only comparable across nights on the same Lighthouse, and a consumer
    # repo's lockfile is not ours to edit.
    - name: Install the pinned Lighthouse
      shell: bash
      run: npm install --omit=dev --no-audit --no-fund --prefix "${{ github.action_path }}"

    - name: Measure
      id: measure
      shell: bash
      env:
        CWV_BASE_URL: ${{ inputs.base-url }}
        CWV_ROUTES: ${{ inputs.routes }}
        CWV_RUNS: ${{ inputs.runs }}
        CWV_FORM_FACTOR: ${{ inputs.form-factor }}
        CWV_CHROME_PATH: ${{ inputs.chrome-path }}
        CWV_HTTP2: ${{ inputs.http2 }}
        CWV_SETUP_MODULE: ${{ inputs.setup-module }}
        CWV_LOCAL_STORAGE: ${{ inputs.local-storage }}
        CWV_ABORT_URL_PATTERNS: ${{ inputs.abort-url-patterns }}
        CWV_HIDE_AUTOMATION: ${{ inputs.hide-automation }}
        CWV_THIRD_PARTY: ${{ inputs.third-party }}
        CWV_OUT_INPUT: ${{ inputs.output-file }}
      run: |
        out="${CWV_OUT_INPUT:-${RUNNER_TEMP:-/tmp}/cwv/measurements.json}"
        CWV_OUT="$out" node "${{ github.action_path }}/measure.mjs"
        echo "file=$out" >> "$GITHUB_OUTPUT"
