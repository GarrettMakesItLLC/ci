name: Scheduled ops

# Two independent maintenance jobs a repo runs on a cron it owns: bump stale
# dependencies via a PR, and close/label issues nobody has touched. Neither
# gates a PR, so — unlike everything under actions/* — this is a reusable
# workflow rather than a composite action; there is no required-check name to
# preserve.
#
# Called as:
#
#   on:
#     schedule:
#       - cron: '0 6 * * 1'
#     workflow_dispatch:
#
#   jobs:
#     ops:
#       uses: GarrettMakesItLLC/ci/.github/workflows/scheduled-ops.yml@v1
#       with:
#         package-manager: npm
#       secrets: inherit

on:
  workflow_call:
    inputs:
      package-manager:
        description: npm or pnpm.
        type: string
        default: npm
      run-dependency-bump:
        description: Open a PR bumping outdated dependencies.
        type: boolean
        default: true
      run-stale-check:
        description: Label and close stale issues/PRs.
        type: boolean
        default: true
      stale-days:
        description: Days of inactivity before an issue/PR is marked stale.
        type: number
        default: 60
      stale-close-days:
        description: Days after being marked stale before closing.
        type: number
        default: 14
      dependency-bump-branch:
        description: Branch the dependency-bump PR is opened from/to.
        type: string
        default: chore/scheduled-dependency-bump
    secrets:
      RELEASE_PAT:
        description: >
          A PAT for opening the dependency-bump PR. OPTIONAL, and the job
          degrades loudly without it rather than silently.

          This enterprise blocks `GITHUB_TOKEN` from creating pull requests
          outright — "The enterprise does not allow GitHub Actions to create or
          approve pull requests", 409, reproduced in this org by platform#578
          from a workflow that also declared `pull-requests: write`. The
          permission is not the constraint; the policy is, and no permissions
          block can satisfy it.

          `release-cut.yml` in this repo already takes a PAT for the adjacent
          reason (a `GITHUB_TOKEN`-opened PR triggers no `pull_request`
          workflows, so its checks never run). This job inherited neither that
          token choice nor its safety net (#54a).
        required: false

jobs:
  dependency-bump:
    name: Bump dependencies
    if: inputs.run-dependency-bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # For the failure issue below — a job that cannot report its own failure
      # is the thing #54a is about.
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: GarrettMakesItLLC/ci/actions/setup-node-workspace@v1
        with:
          package-manager: ${{ inputs.package-manager }}
          install: 'false'

      - name: Bump outdated dependencies
        shell: bash
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          # Pinned, not `latest`. This job holds `contents: write` +
          # `pull-requests: write`, and a bare `npx --yes npm-check-updates`
          # resolves and executes whatever `latest` is at that moment —
          # arbitrary third-party code in a credentialed job, with no version
          # bound and no review. Same class as an unpinned action, by a
          # different route (#53).
          #
          # A version rather than `--no-install`, which `format-check` uses:
          # that works there because the formatter IS a dependency of the repo
          # being checked. `npm-check-updates` is not a dependency of anything
          # here, so there is nothing local to run and the choice is between a
          # pinned fetch and an unpinned one.
          NCU_VERSION=23.1.0
          if [ "$PM" = "pnpm" ]; then
            corepack enable pnpm
            npx --yes "npm-check-updates@${NCU_VERSION}" --packageManager pnpm -u
            pnpm install
          else
            npx --yes "npm-check-updates@${NCU_VERSION}" -u
            npm install
          fi

      - name: Open the bump PR
        id: pr
        # Falls back to GITHUB_TOKEN so the job still runs where the policy
        # does not apply; where it does, the failure is now REPORTED rather
        # than left in an Actions tab nobody watches.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # The PAT when the caller supplies one, `GITHUB_TOKEN` otherwise.
          # Under this enterprise's policy the fallback CANNOT open a PR; it is
          # kept so the workflow still works wherever the policy does not
          # apply, and the failure below is what makes the difference visible.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.dependency-bump-branch }}
          commit-message: 'chore(deps): scheduled dependency bump'
          title: 'chore(deps): scheduled dependency bump'
          body: >
            Automated dependency bump from the `scheduled-ops` workflow. CI on this
            PR is the verification — merge once it is green.
          labels: type:task,source:agent

      # A WEEKLY SCHEDULED JOB FAILS INTO AN ACTIONS TAB NOBODY WATCHES.
      # `release-cut.yml` in this repo already files an issue when its PR step
      # fails; this workflow inherited the hazard and not the safety net
      # (#54a). Without this the only symptom of a blocked PR creation is
      # dependencies quietly never being bumped.
      - name: Describe the failure
        if: failure() && steps.pr.outcome == 'failure'
        shell: bash
        env:
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          set -euo pipefail
          {
            echo "The scheduled dependency-bump PR could not be opened."
            echo
            if [ "$HAS_PAT" != "true" ]; then
              echo "**No \`RELEASE_PAT\` secret is set for this caller**, so the step ran as"
              echo "\`GITHUB_TOKEN\`. This enterprise blocks that outright:"
              echo
              echo '> The enterprise does not allow GitHub Actions to create or approve pull requests'
              echo
              echo "No \`permissions:\` block can satisfy that — it is org policy, not a scope."
              echo "Pass a PAT: \`secrets: inherit\` plus a \`RELEASE_PAT\` on the calling repo,"
              echo "the same secret \`release-cut.yml\` already uses."
            else
              echo "A \`RELEASE_PAT\` was supplied, so this is NOT the enterprise PR-creation"
              echo "policy. Read the step log — a PAT that has expired or lost \`repo\` scope"
              echo "fails here the same way."
            fi
            echo
            echo "Alternatively, disable this job with \`run-dependency-bump: false\` where"
            echo "Renovate already owns dependency updates — it creates PRs as a GitHub App"
            echo "and is not subject to this policy."
          } > /tmp/bump-failure.md

      - name: File an issue if the bump PR could not be opened
        if: failure() && steps.pr.outcome == 'failure'
        uses: GarrettMakesItLLC/ci/actions/file-failure-issue@v1
        with:
          title: 'Scheduled dependency bump could not open its PR'
          body-file: /tmp/bump-failure.md
          labels: ci-failure,area:platform,type:bug,status:ready,source:agent
          token: ${{ secrets.GITHUB_TOKEN }}

  stale-check:
    name: Stale issues and PRs
    if: inputs.run-stale-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: ${{ inputs.stale-days }}
          days-before-close: ${{ inputs.stale-close-days }}
          stale-issue-label: status:waiting
          stale-pr-label: status:waiting
          stale-issue-message: >
            No activity in ${{ inputs.stale-days }} days — marking stale. Closes in
            ${{ inputs.stale-close-days }} more days without activity.
          stale-pr-message: >
            No activity in ${{ inputs.stale-days }} days — marking stale. Closes in
            ${{ inputs.stale-close-days }} more days without activity.
          exempt-issue-labels: status:blocked,launch-blocker
          exempt-pr-labels: launch-blocker
