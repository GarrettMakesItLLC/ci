name: Self check

# This repo has the widest blast radius of any here: a bad push lands in every
# consumer at once, and there is no staging tier for a shared action. Its own
# workflows and action definitions therefore have to be linted here, because
# nowhere downstream will catch them before they run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint actions and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # actionlint understands reusable-workflow and composite-action schemas, so
      # it catches a bad `inputs:` block or an undefined context here rather than
      # in a consumer's first red run.
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      # actionlint does not check composite actions under actions/*, only
      # workflows — so validate those separately: every action.yml must parse and
      # declare the fields the runner requires.
      - name: Composite actions declare what the runner needs
        run: |
          fail=0
          shopt -s nullglob
          found=0
          for f in actions/*/action.yml; do
            found=$((found + 1))
            for key in name description runs; do
              grep -qE "^${key}:" "$f" || { echo "::error file=$f::missing top-level '${key}:'"; fail=1; }
            done
            grep -qE "^  using: composite" "$f" || { echo "::error file=$f::runs.using must be 'composite'"; fail=1; }
            # Every step in a composite action must declare a shell, and the
            # runner's error for a missing one names no file.
            awk -v f="$f" '
              /^    - / { instep=1; hasrun=0; hasshell=0; hasuses=0 }
              /^      run:/   { hasrun=1 }
              /^      shell:/ { hasshell=1 }
              /^      uses:/  { hasuses=1 }
              /^    - |^$/ {
                if (instep && hasrun && !hasshell && !hasuses) {
                  printf "::error file=%s::a run: step is missing shell:\n", f; exit 1
                }
              }
            ' "$f" || fail=1
          done
          [ "$found" -eq 0 ] && { echo "::error::no composite actions found — did the layout change?"; fail=1; }
          echo "checked $found composite action(s)"
          exit "$fail"

      # The README is the consumer-facing contract. If it tells people to pin
      # @main, someone will.
      - name: README pins a tag, never @main
        run: |
          if grep -nE "GarrettMakesItLLC/ci[^@]*@main" README.md CLAUDE.md; then
            echo "::error::docs must pin a version tag, never @main"
            exit 1
          fi
          echo "ok"

  # Proves post-deploy-probe.yml's failure path actually fires, not just that
  # it parses. actionlint (above) catches a malformed `inputs:`/`workflow_call`
  # block, but says nothing about whether the probe logic itself detects a
  # real failure — a status check inverted, an off-by-one in the retry loop,
  # or a jq filter that silently no-ops all read the same as success to
  # actionlint. Both fixtures run dry-run: true, so neither files or closes a
  # real issue against this repo.
  probe-fixture-good:
    name: 'post-deploy-probe fixture: known-good'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/post-deploy-probe.yml
    with:
      probes: |
        [{"url": "https://raw.githubusercontent.com/github/gitignore/main/README.md", "expected_status": 200, "body_contains": "gitignore"}]
      issue-title: 'post-deploy-probe self-check fixture (good) — never filed'
      dry-run: true

  probe-fixture-bad:
    name: 'post-deploy-probe fixture: known-bad'
    permissions:
      contents: read
      issues: write
    # Expected to fail: the URL only ever answers 200, so asserting 599
    # proves the status-mismatch path actually goes red rather than
    # silently passing everything.
    continue-on-error: true
    uses: ./.github/workflows/post-deploy-probe.yml
    with:
      probes: |
        [{"url": "https://raw.githubusercontent.com/github/gitignore/main/README.md", "expected_status": 599}]
      issue-title: 'post-deploy-probe self-check fixture (bad) — never filed'
      dry-run: true

  probe-fixture-check:
    name: post-deploy-probe gate fires on defect
    needs: [probe-fixture-good, probe-fixture-bad]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Known-good passed and known-bad failed
        env:
          GOOD: ${{ needs.probe-fixture-good.result }}
          BAD: ${{ needs.probe-fixture-bad.result }}
        run: |
          echo "known-good: $GOOD, known-bad: $BAD"
          fail=0
          if [ "$GOOD" != "success" ]; then
            echo "::error::the known-good fixture should have passed but was $GOOD"
            fail=1
          fi
          if [ "$BAD" != "failure" ]; then
            echo "::error::the known-bad fixture should have failed but was $BAD — the probe's failure detection is not firing"
            fail=1
          fi
          exit "$fail"

  ci-success:
    name: CI Success
    if: always() && github.event_name == 'pull_request'
    needs: [lint, probe-fixture-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no required job failed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::$bad"
            exit 1
          fi
          echo "All required jobs succeeded."
