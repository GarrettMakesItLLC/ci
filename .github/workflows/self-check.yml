name: Self check

# This repo has the widest blast radius of any here: a bad push lands in every
# consumer at once, and there is no staging tier for a shared action. Its own
# workflows and action definitions therefore have to be linted here, because
# nowhere downstream will catch them before they run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  # The `v1-current` job below is only useful if something asks it. A merge that
  # never released leaves no event behind, so a daily run is what turns it up.
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint actions and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # actionlint understands reusable-workflow and composite-action schemas, so
      # it catches a bad `inputs:` block or an undefined context here rather than
      # in a consumer's first red run.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          fail-on-error: true

      # actionlint does not check composite actions under actions/*, only
      # workflows — so validate those separately: every action.yml must parse and
      # declare the fields the runner requires.
      - name: Composite actions declare what the runner needs
        run: bash scripts/check-composite-shape.sh

      # The README is the consumer-facing contract. If it tells people to pin
      # @main, someone will.
      - name: README pins a tag, never @main
        run: bash scripts/check-doc-pins.sh

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # check-dependency-inventory's own logic can't be proven by actionlint or the
      # YAML shape checks above — only by running it against a fixture pair with a
      # known-drifted dependency and confirming it actually fails, plus a
      # known-clean pair that passes. Fixtures live at
      # actions/check-dependency-inventory/fixtures/{pass,fail}.
      - name: check-dependency-inventory fixtures fire correctly
        run: bash scripts/check-dependency-inventory-fixtures.sh

      # release.yml names each release from this; a wrong bump rule mints an
      # immutable tag nobody can take back.
      - name: next-release-tag fixtures
        run: bash scripts/next-release-tag.test.sh

  # Proves post-deploy-probe.yml's failure path actually fires, not just that
  # it parses. actionlint (above) catches a malformed `inputs:`/`workflow_call`
  # block, but says nothing about whether the probe logic itself detects a
  # real failure — a status check inverted, an off-by-one in the retry loop,
  # or a jq filter that silently no-ops all read the same as success to
  # actionlint. Both fixtures run dry-run: true, so neither files or closes a
  # real issue against this repo.
  probe-fixture-good:
    name: 'post-deploy-probe fixture: known-good'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/post-deploy-probe.yml
    with:
      probes: |
        [{"url": "https://raw.githubusercontent.com/github/gitignore/main/README.md", "expected_status": 200, "body_contains": "gitignore"}]
      issue-title: 'post-deploy-probe self-check fixture (good) — never filed'
      dry-run: true

  probe-fixture-bad:
    name: 'post-deploy-probe fixture: known-bad'
    permissions:
      contents: read
      issues: write
    # Expected to fail: the URL only ever answers 200, so asserting 599
    # proves the status-mismatch path actually goes red rather than
    # silently passing everything. `continue-on-error` is not a supported key
    # on a job that calls a reusable workflow — GitHub then reads the whole
    # job as an ordinary one missing `runs-on` and rejects `uses`/`with` as
    # unexpected. Unneeded anyway: probe-fixture-check already runs `if:
    # always()` and reads this job's `.result`, so a normal failure here
    # doesn't block it.
    uses: ./.github/workflows/post-deploy-probe.yml
    with:
      probes: |
        [{"url": "https://raw.githubusercontent.com/github/gitignore/main/README.md", "expected_status": 599}]
      issue-title: 'post-deploy-probe self-check fixture (bad) — never filed'
      dry-run: true

  probe-fixture-check:
    name: post-deploy-probe gate fires on defect
    needs: [probe-fixture-good, probe-fixture-bad]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Known-good passed and known-bad failed
        env:
          GOOD: ${{ needs.probe-fixture-good.result }}
          BAD: ${{ needs.probe-fixture-bad.result }}
        run: |
          echo "known-good: $GOOD, known-bad: $BAD"
          fail=0
          if [ "$GOOD" != "success" ]; then
            echo "::error::the known-good fixture should have passed but was $GOOD"
            fail=1
          fi
          if [ "$BAD" != "failure" ]; then
            echo "::error::the known-bad fixture should have failed but was $BAD — the probe's failure detection is not firing"
            fail=1
          fi
          exit "$fail"

  file-failure-issue-fixture:
    name: file-failure-issue fixture (file/close lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Unit-level: runs file.sh/close.sh unmodified against a fake `gh`, no
      # network and nothing filed in a real tracker. See the script header
      # for why this is safe to run on every PR rather than hitting the API.
      - name: Exercise file -> file (dedupe) -> close -> close (no-op)
        run: bash actions/file-failure-issue/fixture-test.sh "the automated check failed"

  check-action-pins-fixture:
    name: check-action-pins fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The fixture set carries one violation of each rule the action
      # enforces (org @main, unpinned third-party tag, major-version skew)
      # plus lines that must NOT trip it (a trusted owner on a tag, a
      # correctly SHA-pinned third party, a local action reference). This
      # step must fail — `continue-on-error` captures that as an outcome to
      # assert on next, rather than failing the job here.
      - name: Fixture with violations must fail
        id: violations
        continue-on-error: true
        uses: ./actions/check-action-pins
        with:
          workflow-dir: .github/fixtures/check-action-pins/violations

      - name: Assert the violating fixture failed
        run: |
          if [ "${{ steps.violations.outcome }}" != "failure" ]; then
            echo "::error::check-action-pins passed a fixture with known violations — the check is not firing"
            exit 1
          fi
          echo "ok — violating fixture correctly failed"

      # The clean fixture has no violations and must pass outright — no
      # continue-on-error, so a regression here fails the job directly.
      - name: Fixture with no violations must pass
        uses: ./actions/check-action-pins
        with:
          workflow-dir: .github/fixtures/check-action-pins/clean

      # The recursion itself, guarded. `nested-only/` holds its violation in
      # a SUBDIRECTORY and nothing at the top level, so a collector that
      # stopped recursing would open no files and report success — which is
      # exactly how `actions/` passed while holding two unpinned third-party
      # references (#53). This step must fail.
      - name: Nested-only fixture must fail
        id: nested
        continue-on-error: true
        uses: ./actions/check-action-pins
        with:
          workflow-dir: .github/fixtures/check-action-pins/nested-only

      - name: Assert the nested-only fixture failed
        run: |
          if [ "${{ steps.nested.outcome }}" != "failure" ]; then
            echo "::error::check-action-pins passed a fixture whose only violation is in a subdirectory — it has stopped recursing, and any composite-action tree it is pointed at is unchecked"
            exit 1
          fi
          echo "ok — nested-only fixture correctly failed"

      # THIS REPO'S OWN REFERENCES, not just the fixtures.
      #
      # The action existed, was fixture-tested, and had never been pointed at
      # the tree that ships it — so the repo enforcing pinning across the
      # fleet ran four third-party actions on mutable tags in every
      # consumer's pipeline (#53). A checker aimed only at its own fixtures
      # proves the checker works and nothing about the repo.
      #
      # Both trees, because `uses:` lines live in both: reusable workflows
      # under .github/workflows, composite actions under actions/.
      - name: This repo's workflows are pinned
        uses: ./actions/check-action-pins
        with:
          workflow-dir: .github/workflows

      - name: This repo's composite actions are pinned
        uses: ./actions/check-action-pins
        with:
          workflow-dir: actions

  pr-body-lint-fixtures:
    name: pr-body-lint catches its traps
    # actions/pr-body-lint has no test suite of its own (this repo has none),
    # so its fixture cases run here — the same reasoning as the composite-
    # action structural checks above: nowhere downstream catches a regression
    # before it reaches a consumer.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # MuscleBuddy #4929: "Does not close #4885 — the recapture itself is
      # still owed" still closed #4885 on merge. GitHub's parser has no
      # notion of negation, so this must be caught.
      - name: Negated close must fail the check
        id: negated
        continue-on-error: true
        uses: ./actions/pr-body-lint
        with:
          body: 'Does not close #4885 — the recapture itself is still owed.'
      - name: Assert negated-close fixture failed
        if: steps.negated.outcome != 'failure'
        run: |
          echo "::error::negated-close fixture was expected to fail the check but outcome was '${{ steps.negated.outcome }}'"
          exit 1

      # MuscleBuddy #4597: "Closes #4879, #4885" only closed #4879 — the
      # keyword has to be repeated per issue.
      - name: Comma-list must fail the check
        id: comma
        continue-on-error: true
        uses: ./actions/pr-body-lint
        with:
          body: 'Closes #4879, #4885'
      - name: Assert comma-list fixture failed
        if: steps.comma.outcome != 'failure'
        run: |
          echo "::error::comma-list fixture was expected to fail the check but outcome was '${{ steps.comma.outcome }}'"
          exit 1

      - name: Single closing reference must pass the check
        uses: ./actions/pr-body-lint
        with:
          body: 'Closes #12'

      - name: Keyword repeated per issue must pass the check
        uses: ./actions/pr-body-lint
        with:
          body: 'Closes #12, Closes #34'

  deploy-target-fixtures:
    name: deploy-target fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Unit-level: deployDecision() directly, the fail-open paths and both
      # donor shapes (ci#62). node is preinstalled on ubuntu-latest; this
      # script has no dependencies.
      - name: deployDecision fixture cases
        run: node actions/deploy-target/deploy-target.fixtures.mjs

      # Composite-action level: the three cases the issue asks for, run
      # through the real `uses:` path so a drift between action.yml's env
      # wiring and the script's env reads is caught here, not in a consumer.
      - name: SHOULD deploy — dev branch, matching path
        id: should_deploy
        uses: ./actions/deploy-target
        with:
          git-ref: dev
          always-build-refs: dev
          always-build-ref-prefixes: 'release/'
          paths: |
            apps/web/
          changed-paths: apps/web/src/App.tsx

      - name: assert SHOULD deploy
        run: |
          [ "${{ steps.should_deploy.outputs.build }}" = "true" ] || {
            echo "::error::expected build=true, got '${{ steps.should_deploy.outputs.build }}' (${{ steps.should_deploy.outputs.reason }})"
            exit 1
          }

      - name: SHOULD NOT deploy — wrong branch
        id: wrong_branch
        uses: ./actions/deploy-target
        with:
          git-ref: feature/x
          always-build-refs: dev
          always-build-ref-prefixes: 'release/'

      - name: assert SHOULD NOT deploy (wrong branch)
        run: |
          [ "${{ steps.wrong_branch.outputs.build }}" = "false" ] || {
            echo "::error::expected build=false, got '${{ steps.wrong_branch.outputs.build }}' (${{ steps.wrong_branch.outputs.reason }})"
            exit 1
          }

      - name: SHOULD NOT deploy — no matching path changed
        id: no_matching_path
        uses: ./actions/deploy-target
        with:
          git-ref: feature/x
          always-build-refs: dev
          always-build-ref-prefixes: 'release/'
          paths: |
            apps/web/
          changed-paths: |
            apps/server/index.ts
            prisma/schema.prisma

      - name: assert SHOULD NOT deploy (no matching path)
        run: |
          [ "${{ steps.no_matching_path.outputs.build }}" = "false" ] || {
            echo "::error::expected build=false, got '${{ steps.no_matching_path.outputs.build }}' (${{ steps.no_matching_path.outputs.reason }})"
            exit 1
          }

  # Consumers pin `@v1`, so a change merged to `main` and never tagged reaches
  # nobody while every sign in the tracker says it shipped. `release.yml` moves
  # the tag automatically; this is the backstop that makes a skipped or failed
  # release visible instead of silent.
  #
  # It runs on `push: main` and on a schedule, never on a PR — on a PR the tag
  # is *supposed* to be behind, because the change has not merged yet.
  v1-current:
    name: v1 covers main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: v1 is not behind the shared surface
        run: |
          git fetch --quiet origin 'refs/tags/v1:refs/tags/v1' || {
            echo "::error::no v1 tag — consumers pinning @v1 resolve nothing"
            exit 1
          }
          # Only the surface a consumer actually runs counts. A README or
          # CLAUDE.md edit reaches nobody downstream and must not redden this.
          drift="$(git diff --name-only v1 origin/main -- .github/workflows actions)"
          if [ -n "$drift" ]; then
            echo "::error::v1 is behind main; these run in consumers only once the tag moves:"
            printf '%s\n' "$drift"
            echo "Run the Release workflow, or mark the change [no-release] if it is meant for v2."
            exit 1
          fi
          echo "v1 covers every workflow and action on main."

  ci-success-dogfood:
    name: ci-success behaves
    # `ci-success` is the one required status check in every consumer repo, and
    # nothing executed it. `self-check` validated that its `action.yml` parses
    # and re-implemented the aggregate inline in jq, so a behaviour regression
    # shipped to all five consumers on the next release with no test having run
    # it (#54b).
    #
    # The `needs` context is just JSON, so every case is synthesizable without
    # orchestrating real jobs. `continue-on-error` captures a must-fail case as
    # an outcome to assert on, the same shape the fixture jobs above use.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: All success passes
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"success"},"b":{"result":"success"}}'

      - name: A skipped job fails when it is not allowed
        id: skipped
        continue-on-error: true
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"success"},"b":{"result":"skipped"}}'

      - name: A failed job fails
        id: failed
        continue-on-error: true
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"failure"}}'

      - name: A cancelled job fails
        id: cancelled
        continue-on-error: true
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"cancelled"}}'

      - name: Empty needs fails rather than passing vacuously
        id: empty
        continue-on-error: true
        uses: ./actions/ci-success
        with:
          needs: '{}'

      - name: Assert every must-fail case failed
        run: |
          set -euo pipefail
          for pair in \
            "skipped:${{ steps.skipped.outcome }}" \
            "failed:${{ steps.failed.outcome }}" \
            "cancelled:${{ steps.cancelled.outcome }}" \
            "empty:${{ steps.empty.outcome }}"; do
            name="${pair%%:*}"; outcome="${pair##*:}"
            if [ "$outcome" != "failure" ]; then
              echo "::error::ci-success PASSED the '$name' case — the gate every repo requires is not firing"
              exit 1
            fi
            echo "ok — $name correctly failed"
          done

      # The allow-skipped path, including the empty-sentinel handling that has
      # no other cover: with no allow-skipped the code builds `allowed=",,"`
      # and must NOT treat that as matching every job. If it did, every skipped
      # job would read as allowed and the check would pass over real gaps —
      # which is the exact failure `ci-success` exists to prevent.
      - name: An allowed skip passes
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"success"},"b":{"result":"skipped"}}'
          allow-skipped: b

      - name: An allow-skipped list tolerates spaces
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"skipped"},"b":{"result":"skipped"}}'
          allow-skipped: 'a, b'

      - name: A job NOT on the allow list still fails
        id: partial
        continue-on-error: true
        uses: ./actions/ci-success
        with:
          needs: '{"a":{"result":"skipped"},"b":{"result":"skipped"}}'
          allow-skipped: a

      - name: Assert the partial allow list still failed
        run: |
          if [ "${{ steps.partial.outcome }}" != "failure" ]; then
            echo "::error::ci-success allowed a skip that was not on its allow-skipped list"
            exit 1
          fi
          echo "ok — an unlisted skip correctly failed"

  ci-success:
    name: CI Success
    if: always() && github.event_name == 'pull_request'
    needs: [lint, probe-fixture-check, file-failure-issue-fixture, check-action-pins-fixture, ci-success-dogfood, pr-body-lint-fixtures, deploy-target-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Dogfooded, not re-implemented. This job previously inlined its own jq
      # aggregate, so the repo publishing `ci-success` did not use it — and an
      # inline copy cannot catch a regression in the published one (#54b).
      - name: Verify no required job failed or was skipped
        uses: ./actions/ci-success
        with:
          needs: ${{ toJSON(needs) }}
