name: Cut a release branch

# Promotion runs through a branch cut from `dev`, not from `dev` itself.
# A `dev -> main` PR takes a new head SHA every time an agent merges, and the
# concurrency group then cancels the in-flight run and starts over — so on a busy
# day the 25-minute e2e gate never converges, and each restart bills a cancelled
# run for a tree nobody is shipping. A release branch is created once and never
# moves, so the gate runs exactly once while `dev` keeps taking merges.
#
# It cuts the branch AND opens the promotion PR, using `RELEASE_PAT` — never
# GITHUB_TOKEN. A pull request opened with the default token triggers no
# `pull_request` workflows, so the promotion would sit there with no checks at
# all, which looks far more like a green light than a red one. A different
# actor's token fires them normally.
#
# `RELEASE_PAT` is optional. Without it the PR step is skipped and the job
# summary prints the command to open one by hand, which is what a fork or a
# fresh clone gets. Merging is never automated: CI is the gate and a human
# decides to promote.
#
# Called as:
#
#   cut:
#     permissions:
#       contents: write
#       pull-requests: read
#       issues: write
#     uses: GarrettMakesItLLC/ci/.github/workflows/release-cut.yml@v1
#     with:
#       sha: ${{ inputs.sha }}
#     secrets: inherit
#
# The permissions block is not optional in practice. A called workflow's own
# `permissions:` can only narrow what the run was granted, never widen it — so
# a caller repo with a read-only default `GITHUB_TOKEN` (common) mints a
# read-only token for the run unless the calling job grants these explicitly,
# and this workflow's `contents: write` / `issues: write` then exceed it. That
# fails the whole run at `startup_failure` with zero jobs and no logs, before
# any step exists to explain why.

on:
  workflow_call:
    inputs:
      sha:
        description: 'dev commit to cut from (default: dev HEAD)'
        required: false
        type: string
    secrets:
      RELEASE_PAT:
        required: false

concurrency:
  # Queue, never cancel: this creates a branch, and a cancelled run can leave
  # one behind with nothing pointing at it.
  group: release-cut
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  # For the failure-issue step only. The promotion PR is opened with
  # RELEASE_PAT, deliberately not with GITHUB_TOKEN — see that step.
  issues: write

jobs:
  cut:
    name: Cut a release branch
    runs-on: ubuntu-latest
    # Git refs and a handful of `gh` calls — well under a minute. Capped so a hung
    # call cannot inherit the 360-minute default; this job also refuses to
    # run while a promotion is open, so a hang here blocks the next cut too.
    timeout-minutes: 10
    env:
      # Job level, not step level: a step's `if` is evaluated before its own
      # `env` block is applied, so a flag defined there would read as empty.
      HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          # Full history: the summary counts and lists the commits being
          # promoted, which a shallow clone cannot see.
          fetch-depth: 0

      - name: Refuse to cut while a promotion PR is already open
        # Two open release branches is a state nobody can reason about: the
        # second one's diff is against a `main` the first is about to move.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --json number,headRefName --jq '.[] | "#\(.number) (\(.headRefName))"')
          if [ -n "$open" ]; then
            echo "::error title=A promotion is already in flight::$open is open into main. Merge or close it before cutting another."
            exit 1
          fi
          echo "OK: no open promotion PR."

      - name: Resolve the commit to cut from
        id: point
        env:
          REQUESTED: ${{ inputs.sha }}
        run: |
          sha=$(git rev-parse "${REQUESTED:-dev}")
          # A commit that is not on dev would promote a tree staging never ran.
          if ! git merge-base --is-ancestor "$sha" origin/dev; then
            echo "::error title=Not a dev commit::$sha is not an ancestor of dev."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short "$sha")" >> "$GITHUB_OUTPUT"

      - name: Is there anything to promote?
        id: diff
        # Full fetch, not --depth=1: after a promotion `main`'s tip is a merge
        # commit that is NOT on dev, so a shallow main would graft the traversal
        # short and count commits that already shipped.
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          count=$(git rev-list --count origin/main.."${{ steps.point.outputs.sha }}")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Nothing to promote
        if: steps.diff.outputs.count == '0'
        run: |
          echo "::notice title=Nothing to promote::main is already at this commit. No branch cut."

      - name: Create the release branch
        if: steps.diff.outputs.count != '0'
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.point.outputs.sha }}
        run: |
          # UTC minute in the name, so a second cut on the same day cannot
          # collide with the first. The ref create is atomic, so if one somehow
          # did, this fails loudly instead of moving an existing branch.
          branch="release/$(date -u +%Y-%m-%d-%H%M)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$SHA" >/dev/null
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      # Opened with RELEASE_PAT, never GITHUB_TOKEN. A pull request opened with
      # the default token triggers no `pull_request` workflows, so the promotion
      # would carry no checks at all — which reads as permission rather than as
      # a gap, and is the most dangerous shape this could take. A different
      # actor's token fires them normally, so the promotion is gated exactly as
      # a hand-opened one is.
      #
      # The secret is optional: without it this step is skipped and the summary
      # below still prints the manual command, which is what a fresh clone or a
      # fork gets. Nothing here is load-bearing on the secret existing.
      - name: Open the promotion PR
        id: pr
        if: steps.diff.outputs.count != '0' && env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          BRANCH: ${{ steps.branch.outputs.name }}
          SHORT: ${{ steps.point.outputs.short }}
          COUNT: ${{ steps.diff.outputs.count }}
          SHA: ${{ steps.point.outputs.sha }}
        run: |
          set -euo pipefail
          body="$(
            {
              echo "Promotes \`dev\` (\`$SHORT\`) to production — $COUNT commits."
              echo
              echo "Cut by \`release-cut.yml\`. The branch head does not move, so the"
              echo "e2e gate runs once while \`dev\` keeps taking merges."
              echo
              echo "**Merge with a merge commit.** Squashing rewrites every release"
              echo "commit and breaks version computation."
              echo
              echo "A fix found during promotion lands on \`dev\` first and is"
              echo "cherry-picked onto \`$BRANCH\` — a commit that exists only here is"
              echo "not on \`dev\`, so the next promotion silently reverts it."
              echo
              echo "### Commits"
              echo
              git log --no-merges --pretty='- %s' "origin/main..$SHA"
            }
          )"
          url="$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): promote dev ($SHORT) to production" \
            --body "$body")"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Opened $url"

      # A cut that produced a branch nobody promotes is the failure mode worth
      # catching: the branch sits, `dev` keeps moving, and the next cut refuses
      # because a promotion is already open.
      - name: Compose the cut-failure body
        if: failure() && steps.pr.outcome == 'failure'
        run: |
          cat >/tmp/cut-failure.md <<EOF
          \`release-cut.yml\` cut \`${{ steps.branch.outputs.name }}\` but could not open
          its promotion PR, so the branch exists with nothing pointing at it.

          - **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Branch:** \`${{ steps.branch.outputs.name }}\`

          Most likely \`RELEASE_PAT\` expired or was revoked. Open the PR by hand to
          unblock the promotion:

          \`\`\`bash
          gh pr create --base main --head ${{ steps.branch.outputs.name }} \\
            --title 'chore(release): promote dev to production'
          \`\`\`

          Leaving the branch un-promoted also blocks the *next* cut, which refuses
          to run while a promotion is open.
          EOF

      # `ci-failure` is load-bearing, not decoration: repos with a
      # close-failure-issue.sh match open issues carrying it, by exact title,
      # to close this one once a cut succeeds. Drop the label and the issue is
      # never closed.
      - name: File an issue if the PR could not be opened
        if: failure() && steps.pr.outcome == 'failure'
        uses: GarrettMakesItLLC/ci/actions/file-failure-issue@v1
        with:
          title: Release cut could not open its promotion PR
          body-file: /tmp/cut-failure.md
          labels: ci-failure,area:platform,type:bug,status:ready,source:agent
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tell the promoter what to do next
        if: steps.diff.outputs.count != '0'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          BRANCH: ${{ steps.branch.outputs.name }}
          SHORT: ${{ steps.point.outputs.short }}
          COUNT: ${{ steps.diff.outputs.count }}
          SHA: ${{ steps.point.outputs.sha }}
        run: |
          {
            echo "## Cut \`$BRANCH\` at \`$SHORT\` — $COUNT commits to promote"
            echo
            if [ -n "$PR_URL" ]; then
              echo "Promotion PR: $PR_URL"
            else
              echo "No \`RELEASE_PAT\`, so no PR was opened. Open it **with your own"
              echo "token** so CI actually runs:"
              echo
              echo '```'
              echo "gh pr create --base main --head $BRANCH \\"
              echo "  --title 'chore(release): promote dev ($SHORT) to production'"
              echo '```'
            fi
            echo
            echo "The branch head does not move, so the e2e gate runs once. A fix"
            echo "found during promotion lands on \`dev\` first and is cherry-picked"
            echo "onto \`$BRANCH\` — never commit it only here, or the next promotion"
            echo "silently reverts it. Merge with a **merge commit**; squashing"
            echo "rewrites every release commit and breaks version computation."
            echo
            echo "### Commits"
            echo
            git log --no-merges --pretty='- %s' "origin/main..$SHA"
          } >> "$GITHUB_STEP_SUMMARY"
