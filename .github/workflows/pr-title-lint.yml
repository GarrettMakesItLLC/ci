name: Semantic PR Title

# Every repo here squash-merges feature PRs, so the PR title becomes the commit
# on the integration branch. It has to parse as a Conventional Commit or version
# computation downstream reads a subject it cannot classify.
#
# Called as:
#
#   lint-pr-title:
#     uses: GarrettMakesItLLC/ci/.github/workflows/pr-title-lint.yml@v1

on:
  workflow_call:
    inputs:
      types:
        description: Newline-separated allowed Conventional Commit types.
        required: false
        default: |
          feat
          fix
          perf
          refactor
          docs
          chore
          test
          build
          ci
          style
          revert
        type: string
      require-scope:
        description: Require a scope in the title.
        required: false
        default: false
        type: boolean

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    name: Semantic PR Title
    runs-on: ubuntu-latest
    # A regex over the PR title — seconds. Capped so a hung action cannot inherit
    # the 360-minute default.
    timeout-minutes: 5
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.require-scope }}
