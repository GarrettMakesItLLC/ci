name: CI
on:
  pull_request:
  merge_group:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps: [{ run: echo lint }]

  # Static on purpose: the merge queue must see the real name.
  ci-success:
    name: CI Success
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [lint]
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  promotion-gate:
    name: >-
      ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && 'Promotion gate' || 'Promotion gate (skipped lane)' }}
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-latest
    steps: [{ run: echo gate }]
